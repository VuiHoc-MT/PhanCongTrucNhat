<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bảng Phân Công Trực Nhật Lớp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .dragging { opacity: 0.5; transform: scale(0.95); }
    .drag-over { background-color: #dbeafe !important; border: 2px dashed #3b82f6 !important; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .chip-anim { animation: fadeIn 0.1s ease-out; }
    @keyframes gradientBG {
      0% { background-position: 0% 250%; }
      50% { background-position: 250% 0%; }
      100% { background-position: 0% 250%;}
    }
    .bg-aurora {
      background: linear-gradient(-45deg, #0039f6, #e6a5f9, #92c1ff, #8efc99);
      background-size: 400% 400%;
      animation: gradientBG 5s ease infinite;
    }
    .bg-dot-grid {
      background-color: #f8fafc;
      background-image: radial-gradient(#94a3b8 1px, transparent 1px);
      background-size: 24px 24px;
    }
  </style>
</head>
<body class="bg-aurora text-slate-800 min-h-screen font-sans">
  <div class="fixed top-[-10%] left-[-5%] w-96 h-96 bg-purple-300/40 rounded-full blur-3xl -z-10 pointer-events-none"></div>
  <div class="fixed bottom-[-10%] right-[-5%] w-96 h-96 bg-blue-300/40 rounded-full blur-3xl -z-10 pointer-events-none"></div>

  <!-- Thanh tiêu đề & Đăng nhập Admin -->
  <header class="bg-white border-b border-slate-200 px-6 py-4 flex flex-wrap items-center justify-between gap-4 shadow-sm">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold text-lg shadow">
        TN
      </div>
      <div>
        <h1 class="text-xl font-bold text-slate-800">Lịch Trực Nhật Lớp</h1>
        <p id="syncStatus" class="text-xs text-emerald-600 font-medium">● Đang kết nối máy chủ...</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <span id="roleBadge" class="px-3 py-1 rounded-full text-xs font-semibold bg-slate-200 text-slate-700">
        Chế độ: Khách (Chỉ xem)
      </span>
      <button id="loginBtn" onclick="loginWithGoogle()" class="bg-slate-800 hover:bg-slate-700 text-white text-sm font-medium px-4 py-1.5 rounded-lg transition flex items-center gap-2">
        <span>🔐 Đăng nhập Admin (Google)</span>
      </button>
      <button id="logoutBtn" onclick="logoutAdmin()" class="hidden bg-rose-100 hover:bg-rose-200 text-rose-700 text-sm font-medium px-3 py-1.5 rounded-lg transition">
        Thoát Admin
      </button>
    </div>
  </header>

  <!-- Khu vực chính -->
  <main class="max-w-7xl mx-auto p-6 flex flex-col lg:flex-row gap-6">
    
    <!-- CỘT TRÁI: Danh sách lớp (Chỉ hiện khi là Admin) -->
    <aside id="adminSidebar" class="hidden w-full lg:w-72 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex-shrink-0">
      <h2 class="font-bold text-slate-700 mb-2">Danh sách lớp</h2>
      <p class="text-xs text-slate-500 mb-3">Nhập mỗi tên 1 dòng rồi bấm Cập nhật, sau đó kéo thả vào bảng.</p>
      
      <textarea id="studentInput" rows="5" placeholder="Nguyễn Văn A&#10;Trần Thị B&#10;Lê Văn C..." 
                class="w-full border border-slate-300 rounded-xl p-2.5 text-sm focus:outline-none focus:border-blue-500 mb-2"></textarea>
      <button onclick="updateStudentList()" class="w-full bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold text-sm py-2 rounded-xl transition mb-4">
        + Cập nhật danh sách
      </button>

      <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Kéo tên vào bảng:</div>
      <div id="studentPool" class="flex flex-wrap gap-2 max-h-80 overflow-y-auto p-1"></div>
    </aside>

    <!-- CỘT PHẢI: Bảng 6x6 -->
    <section class="flex-1 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm overflow-x-auto">
      <div id="adminToolbar" class="hidden flex flex-wrap items-center justify-between gap-3 mb-4 pb-4 border-b border-slate-100">
        <div class="flex gap-2">
          <button onclick="autoAssignRandom()" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold text-sm px-4 py-2 rounded-xl shadow transition flex items-center gap-2">
            🎲 Tự động phân công random
          </button>
          <button onclick="clearSchedule()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-sm px-4 py-2 rounded-xl transition">
            Xóa bảng
          </button>
          <button onclick = "startNewCycle()" class = "bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm px-4 py-2 rounded-xl shadow transition flex items-center gap-1.5">
            🔄 Sang chu kỳ tuần mới
          </button>
        </div>
        <span class="text-xs text-slate-500 italic">* Mọi thay đổi tự động lưu lên mạng cho cả lớp xem</span>
      </div>

      <table class="w-full min-w-[680px] border-collapse">
        <thead>
          <tr id="tableHeader" class="bg-slate-100 text-slate-700 text-sm">
            <th class="border border-slate-200 p-3 text-left w-44 rounded-tl-xl">Công việc</th>
          </tr>
        </thead>
        <tbody id="scheduleBody" class="text-sm"></tbody>
      </table>
      <!-- KHUNG BÁO BÀI / GHI CHÚ LỚP -->
      <div class="mt-6 pt-5 border-t border-slate-200">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-bold text-slate-800 flex items-center gap-2 text-base">
            <span>📌</span> Báo bài & Ghi chú của lớp
          </h3>
          <button id="saveNoticeBtn" onclick="saveClassNotice()" class="hidden bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-3.5 py-1.5 rounded-lg shadow transition">
            💾 Lưu báo bài
          </button>
        </div>

        <!-- Khung hiển thị dành cho Khách (Học sinh xem) -->
        <div id="noticeDisplay" class="bg-amber-50/80 border border-amber-200 rounded-xl p-4 text-sm text-slate-700 whitespace-pre-line min-h-[200px]">
          Chưa có thông tin báo bài mới.
        </div>

        <!-- Ô nhập liệu dành cho Admin (Ẩn với khách) -->
        <textarea id="noticeInput" rows="4" placeholder="Nhập nội dung báo bài, dặn dò kiểm tra hoặc thông báo lớp tại đây..." 
                  class="hidden w-full border border-indigo-300 bg-white rounded-xl p-3 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
      </div>
    </section>
  </main>


  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, update, get, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDeO2BkAXLVRUG5tW2uOX1aQ3VIPSAmobE",
      authDomain: "web-lop-35a2d.firebaseapp.com",
      databaseURL: "https://web-lop-35a2d-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "web-lop-35a2d",
      storageBucket: "web-lop-35a2d.appspot.com",
      messagingSenderId: "977812003616",
      appId: "1:977812003616:web:56a37856a1745a55891545"
    };

    const TASKS = [
      "Quét lớp",
      "Lau bảng",
      "Xếp bàn ghế",
      "Tắt các thiết bị điện",
      "Dọn bàn ăn"
    ];
    
    let DAYS = ["tuan_0", "tuan_1", "tuan_2", "tuan_3", "tuan_4", "tuan_5"];

    function createNewWeekHeaders() {
      let curr = new Date();
      let first = curr.getDate() - curr.getDay() + 1;
      if (curr.getDay() === 0) first = curr.getDate() - 6;
      let monday = new Date(curr.setDate(first));
      let header = [];
        
      for (let i = 0; i < 6; i++) {
        let start = new Date(monday);
        start.setDate(monday.getDate() + i * 7);
        let end = new Date(start);
        end.setDate(start.getDate() + 4);
      
        if (start.getFullYear() !== end.getFullYear()) {
          header.push(`${start.getDate()}/${start.getMonth() + 1}/${start.getFullYear()} - ${end.getDate()}/${end.getMonth() + 1}/${end.getFullYear()}`);
        } else {
          header.push(`${start.getDate()}/${start.getMonth() + 1} - ${end.getDate()}/${end.getMonth() + 1}`);
        }
      }
      return header;
    }

    let weekHeaders = createNewWeekHeaders();

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dataRef = ref(db, "trucNhatLop");
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    let isAdmin = false;
    let appData = {
      students: [],
      schedule: {},
      weekHeaders: weekHeaders,
      notice: "Chưa có thông tin báo bài mới."
    };

    renderAll();

    onValue(dataRef, (snapshot) => {
      const val = snapshot.val();
      if (val) {
        appData.students = val.students || [];
        appData.schedule = val.schedule || {};
        appData.notice = val.notice || "Chưa có thông tin báo bài mới.";
        if (val.weekHeaders && val.weekHeaders.length === 6) {
          weekHeaders = val.weekHeaders;
          appData.weekHeaders = val.weekHeaders;
        }
      }
      const statusEl = document.getElementById("syncStatus");
      statusEl.textContent = "● Đã đồng bộ trực tuyến";
      statusEl.className = "text-xs text-emerald-600 font-medium";
      renderAll();
    }, (error) => {
      const statusEl = document.getElementById("syncStatus");
      statusEl.textContent = "● Lỗi kết nối Firebase: " + error.message;
      statusEl.className = "text-xs text-rose-600 font-medium";
    });

    function saveCellToCloud(cellKey) {
      if (!isAdmin) return;
      const statusEl = document.getElementById("syncStatus");
      statusEl.textContent = "● Đang lưu...";
      const arr = appData.schedule[cellKey];
      set(ref(db, `trucNhatLop/schedule/${cellKey}`),
          arr && arr.length ? arr : null)
        .then(() => statusEl.textContent = "● Đã đồng bộ trực tuyến")
        .catch(() => alert("Không có quyền ghi hoặc dữ liệu không hợp lệ!"));
    }

    function saveToCloud() {
      if (!isAdmin) return;
      const statusEl = document.getElementById("syncStatus");
      statusEl.textContent = "● Đang lưu...";
      set(dataRef, appData)
        .then(() => statusEl.textContent = "● Đã đồng bộ trực tuyến")
        .catch(() => alert("Không có quyền ghi hoặc dữ liệu không hợp lệ!"));
    }

    window.loginWithGoogle = () => {
      signInWithPopup(auth, provider).catch((error) => {
        alert("Đăng nhập thất bại: " + error.message)
      })
    }

    window.logoutAdmin = () => {
      signOut(auth);
    };

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        try {
          // Kiểm tra song song 2 nguồn quyền:
          // 1. Nhánh admins/<uid> (Admin thêm qua Database)
          // 2. Nhánh coreAdmins/<uid> (5 Admin nòng cốt trong Rules - đọc được mà không báo lỗi là hợp lệ)
          const [dbAdminRes, coreAdminRes] = await Promise.allSettled([
            get(ref(db, "admins/" + user.uid)),
            get(ref(db, "coreAdmins/" + user.uid))
          ]);
          
          const isDbAdmin = dbAdminRes.status === "fulfilled" && dbAdminRes.value.exists() && dbAdminRes.value.val() === true;
          const isCoreAdmin = coreAdminRes.status === "fulfilled";
          
          if (isDbAdmin || isCoreAdmin) {
            isAdmin = true;
            document.getElementById("adminSidebar").classList.remove("hidden");
            document.getElementById("adminToolbar").classList.remove("hidden");
            document.getElementById("logoutBtn").classList.remove("hidden");
            document.getElementById("loginBtn").classList.add("hidden");
            document.getElementById("roleBadge").textContent = "Admin: " + user.email;
            document.getElementById("roleBadge").className = "px-3 py-1 rounded-full text-xs font-semibold bg-blue-100 text-blue-700";
            document.getElementById("studentInput").value = appData.students.join("\n");
          
            const saveNoticeBtn = document.getElementById("saveNoticeBtn");
            const noticeInput = document.getElementById("noticeInput");
            const noticeDisplay = document.getElementById("noticeDisplay");
            if (saveNoticeBtn && noticeInput && noticeDisplay) {
              saveNoticeBtn.classList.remove("hidden");
              noticeInput.classList.remove("hidden");
              noticeDisplay.classList.add("hidden");
              noticeInput.value = appData.notice || "";
            }
            renderAll();
          } else {
            isAdmin = false;
            alert("Tài khoản " + user.email + " không có quyền Admin! Bạn chỉ có thể xem lịch.");
            signOut(auth);
          }
        } catch (error) {
          isAdmin = false;
          alert("Lỗi kết nối khi kiểm tra quyền Admin!");
          signOut(auth);
        }
      } else {
        isAdmin = false;
        document.getElementById("adminSidebar").classList.add("hidden");
        document.getElementById("adminToolbar").classList.add("hidden");
        document.getElementById("logoutBtn").classList.add("hidden");
        document.getElementById("loginBtn").classList.remove("hidden");
        document.getElementById("roleBadge").textContent = "Chế độ: Khách (Chỉ xem)";
        document.getElementById("roleBadge").className = "px-3 py-1 rounded-full text-xs font-semibold bg-slate-200 text-slate-700";
      
        const saveNoticeBtn = document.getElementById("saveNoticeBtn");
        const noticeInput = document.getElementById("noticeInput");
        const noticeDisplay = document.getElementById("noticeDisplay");
        if (saveNoticeBtn && noticeInput && noticeDisplay) {
          saveNoticeBtn.classList.add("hidden");
          noticeInput.classList.add("hidden");
          noticeDisplay.classList.remove("hidden");
        }
        renderAll();
      }
    });

    window.updateStudentList = () => {
      if (!isAdmin) return;
      const raw = document.getElementById("studentInput").value;
      appData.students = raw.split("\n").map(s => s.trim()).filter(Boolean);
      renderAll();
      saveToCloud();
    };

    window.autoAssignRandom = () => {
      if (!isAdmin || appData.students.length === 0) return;
      const shuffled = [...appData.students];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
    
      const newSchedule = {};
      let idx = 0;
    
      TASKS.forEach((_, rIdx) => {
        DAYS.forEach((day) => {
          const key = `${rIdx}_${day}`;
          newSchedule[key] = [shuffled[idx % shuffled.length]];
          idx++;
        });
      });
    
      appData.schedule = newSchedule;
      renderAll();
      saveToCloud();
    };

    window.clearSchedule = () => {
      if (!isAdmin) return;
      appData.schedule = {};
      renderAll();
      saveToCloud();
    };

    window.saveClassNotice = () => {
      if (!isAdmin) return;
      const content = document.getElementById("noticeInput").value.trim();
      appData.notice = content || "Chưa có thông tin báo bài mới.";
      renderAll();
      saveToCloud();
    };

    window.startNewCycle = () => {
      if (!isAdmin) return;
      if (!confirm("Bạn có chắc muốn xóa bảng hiện tại và cập nhật 6 tuần mới bắt đầu từ tuần này không?")) return;

      weekHeaders = createNewWeekHeaders();
      appData.weekHeaders = weekHeaders;
      appData.schedule = {};

      renderAll();
      saveToCloud();
    }

    window.removeStudentFromCell = (cellKey, studentIndex) => {
      if (!isAdmin || !appData.schedule[cellKey]) return;
      appData.schedule[cellKey].splice(studentIndex, 1);
      renderAll();
      saveCellToCloud(cellKey);
    };

    function renderAll() {
      const pool = document.getElementById("studentPool");
      if (pool) {
        pool.innerHTML = "";
        appData.students.forEach((name) => {
          const chip = document.createElement("div");
          chip.textContent = name;
          chip.className = "px-3 py-1.5 bg-blue-50 border border-blue-200 text-blue-800 rounded-lg text-xs font-medium cursor-grab active:cursor-grabbing select-none shadow-sm";
          chip.draggable = isAdmin;
          chip.ondragstart = (e) => {
            e.dataTransfer.setData("text/plain", JSON.stringify({ name, fromCell: null, fromIdx: null }));
          };
          pool.appendChild(chip);
        });
      }

      const tbody = document.getElementById("scheduleBody");
      const trHeader = document.getElementById("tableHeader");

      while (trHeader.children.length > 1) {
        trHeader.removeChild(trHeader.lastChild);
      }

      weekHeaders.forEach(weekStr => {
        const th = document.createElement("th");
        th.className = "border border-slate-200 p-3 text-center";
        th.textContent = weekStr;
        trHeader.appendChild(th);
      });

      if (!tbody) return;
      tbody.innerHTML = "";

      TASKS.forEach((task, rIdx) => {
        const tr = document.createElement("tr");
        
        const tdTask = document.createElement("td");
        tdTask.className = "border border-slate-200 p-3 font-semibold text-slate-700 bg-slate-50/70";
        tdTask.textContent = task;
        tr.appendChild(tdTask);

        DAYS.forEach((day) => {
          const cellKey = `${rIdx}_${day}`;
          const td = document.createElement("td");
          td.className = "border border-slate-200 p-2 align-top min-h-[64px] h-16 transition";

          if (isAdmin) {
            td.ondragover = (e) => { e.preventDefault(); td.classList.add("drag-over"); };
            td.ondragleave = () => td.classList.remove("drag-over");
            td.ondrop = (e) => {
              e.preventDefault();
              td.classList.remove("drag-over");

              let payload;
              try {
                payload = JSON.parse(e.dataTransfer.getData("text/plain"));
              } catch (err) {
                return;
              }
            
              if (!payload || !payload.name) return;
            
              if (payload.fromCell !== null && appData.schedule[payload.fromCell]) {
                appData.schedule[payload.fromCell].splice(payload.fromIdx, 1);
                saveCellToCloud(payload.fromCell);
              }
              if (!appData.schedule[cellKey]) appData.schedule[cellKey] = [];
              appData.schedule[cellKey].push(payload.name);

              renderAll();
              saveCellToCloud(cellKey);
            };
          }

          const assigned = appData.schedule[cellKey] || [];
          const wrap = document.createElement("div");
          wrap.className = "flex flex-wrap gap-1.5";

          assigned.forEach((studentName, sIdx) => {
            const tag = document.createElement("span");
            tag.className = "chip-anim inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-xs font-medium bg-indigo-50 text-indigo-700 border border-indigo-200 " + (isAdmin ? "cursor-grab" : "");
            tag.textContent = studentName;

            if (isAdmin) {
              tag.draggable = true;
              tag.ondragstart = (e) => {
                e.dataTransfer.setData("text/plain", JSON.stringify({ name: studentName, fromCell: cellKey, fromIdx: sIdx }));
              };

              const delBtn = document.createElement("button");
              delBtn.innerHTML = "&times;";
              delBtn.className = "text-indigo-400 hover:text-rose-600 font-bold ml-1";
              delBtn.onclick = () => removeStudentFromCell(cellKey, sIdx);
              tag.appendChild(delBtn);
            }

            wrap.appendChild(tag);
          });

          td.appendChild(wrap);
          tr.appendChild(td);
        });

        tbody.appendChild(tr);
      });

      const noticeDisplay = document.getElementById("noticeDisplay");
      if (noticeDisplay) {
        noticeDisplay.textContent = appData.notice || "Chưa có thông tin báo bài mới.";
      }
    }
  </script>
</body>
</html>
